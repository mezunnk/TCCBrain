<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curso</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
<header class="nav">
  <div class="wrap">
    <div class="brand">
  <img src="../../img/logo_branco.svg" width="128" height="128" alt="Brain Flow">
    <nav class="menu">
      <a href="home.html">Home</a>
      <a href="cursos.html">Cursos</a>
      <a href="index.html">Login</a>
      <a class="signup" href="cadastro.html">Cadastro</a>
      <!-- Imagem de perfil do usuário -->
      <span class="user-profile-header">
        <img src="/img/user-placeholder.svg" alt="Perfil" class="user-header-photo">
      </span>
    </nav>
  </div>
</header>


  <!-- Conteúdo -->
  <main class="page">
    <div class="grid">
      <section class="course-hero">
        <h1 class="title" id="courseTitle">Título do curso</h1>
        <p class="sub">Progresso: <span id="progressPct">—</span></p>
      </section>
      <section class="course-layout">
        <div class="player-area">
          <div class="video-frame" id="videoFrame">
            <iframe id="videoIframe" src="" title="Aula atual" frameborder="0" allowfullscreen style="display: none;"></iframe>
            <div id="noVideoMessage" style="display: flex; align-items: center; justify-content: center; height: 100%; background: var(--bg); color: var(--muted); font-size: 18px;">
              Nenhum vídeo selecionado
            </div>
          </div>
          <div class="lesson-header">
            <div class="lesson-header-top">
              <h2 class="lesson-title" id="lessonTitle">Título da aula</h2>
              <div class="avaliacao-botoes-wrap">
                <button class="like-btn" aria-label="Curtir">
                  <img src="/img/coracao.svg" alt="Curtir" width="20" height="20">
                </button>
                <button class="save-btn" aria-label="Salvar">
                  <img src="/img/salvar.svg" alt="Salvar" width="20" height="20">
                </button>
              </div>
            </div>
            <p class="desc" id="lessonDesc">Descrição breve da aula.</p>
          </div>
          <div class="lesson-actions-row">
            <button class="btn dark" id="prevBtn">Aula anterior</button>
            <button class="btn primary" id="completeBtn">Marcar como concluída</button>
            <button class="btn dark" id="nextBtn">Próxima aula</button>
          </div>
        </div>
        <aside class="syllabus" id="syllabus">
          <!-- conteúdo gerado via JS -->
        </aside>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>© Brain Flow</span>
      <nav class="footer-nav">
        <a href="sobre.html">Sobre</a>
        <a href="suporte.html">Suporte</a>
        <a href="termos.html">Termos</a>
      </nav>
    </div>
  </footer>
  <style>
  .user-profile-header {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 16px;
  background: #f0b41b;
  border-radius: 12px;
  width: 44px;
  height: 44px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  .user-header-photo {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  object-fit: cover;
  border: 2px solid #fff;
  background: #f0b41b;
  display: block;
  }
  .icon-like { display:inline-block; width:18px; height:18px; background:url('/img/like.svg') center/contain no-repeat; vertical-align:middle; margin-right:8px; }
  .icon-fav { display:inline-block; width:18px; height:18px; background:url('/img/fav.svg') center/contain no-repeat; vertical-align:middle; margin-right:8px; }
  </style>
  <script>
  let course = null;
  let flatLessons = [];

  async function loadCourseData() {
    try {
      // Simulação de dados (substitui pela tua API depois)
      course = {
        id: "curso1",
        title: "Curso de Exemplo",
        modules: [
          {
            id: "mod1",
            title: "Módulo 1",
            lessons: [
              { id: "l1", title: "Introdução", desc: "Bem-vindo!", video: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
              { id: "l2", title: "Parte 2", desc: "Continuação." }
            ]
          }
        ]
      };
    } catch (error) {
      console.error("Erro ao carregar curso:", error);
      course = { id: null, title: "Erro ao carregar curso", modules: [] };
    }
  }

  // Funções de progresso dependem do ID do curso
  function getProgressKey() { return `progress:${course.id}`; }
  function getCurrentKey() { return `current:${course.id}`; }

  const getProgress = () => JSON.parse(localStorage.getItem(getProgressKey()) || "{}");
  const setProgress = (obj) => localStorage.setItem(getProgressKey(), JSON.stringify(obj));
  const setCurrent = (lessonId) => localStorage.setItem(getCurrentKey(), lessonId);
  const getCurrent = () => localStorage.getItem(getCurrentKey());

  function renderSyllabus() {
    const wrap = document.getElementById("syllabus");
    const progress = getProgress();
    wrap.innerHTML = course.modules.map(m => {
      const count = m.lessons.length;
      const done = m.lessons.filter(l => progress[l.id]).length;
      return `
        <details class="module" open>
          <summary>
            <strong>${m.title}</strong>
            <span class="badge">${done}/${count}</span>
          </summary>
          <ul class="lessons">
            ${m.lessons.map(l => `
              <li class="lesson ${progress[l.id] ? 'done' : ''}">
                <button data-lesson="${l.id}" class="lesson-link">
                  <span class="dot"></span>${l.title}
                </button>
              </li>
            `).join('')}
          </ul>
        </details>
      `;
    }).join('');
    wrap.querySelectorAll(".lesson-link").forEach(btn => {
      btn.addEventListener("click", () => loadLesson(btn.dataset.lesson));
    });
  }

  function loadLesson(lessonId) {
    const lesson = flatLessons.find(l => l.id === lessonId) || flatLessons[0];
    if (!lesson) return;
    document.getElementById("lessonTitle").textContent = lesson.title;
    document.getElementById("lessonDesc").textContent = lesson.desc || "";

    const iframe = document.getElementById("videoIframe");
    const noVideo = document.getElementById("noVideoMessage");
    if (lesson.video) {
      iframe.src = lesson.video;
      iframe.style.display = "block";
      noVideo.style.display = "none";
    } else {
      iframe.style.display = "none";
      noVideo.style.display = "flex";
    }

    setCurrent(lesson.id);
    renderSyllabus();
    updateProgressPct();

    const idx = flatLessons.findIndex(l => l.id === lesson.id);
    document.getElementById("prevBtn").disabled = idx <= 0;
    document.getElementById("nextBtn").disabled = idx >= flatLessons.length - 1;
  }

  function completeCurrent() {
    const cur = getCurrent() || flatLessons[0].id;
    const prog = getProgress();
    prog[cur] = true;
    setProgress(prog);
    renderSyllabus();
    updateProgressPct();
  }

  function go(step) {
    const cur = getCurrent() || flatLessons[0].id;
    const idx = flatLessons.findIndex(l => l.id === cur);
    const target = flatLessons[idx + step];
    if (target) loadLesson(target.id);
  }

  function updateProgressPct() {
    const prog = getProgress();
    const done = flatLessons.filter(l => prog[l.id]).length;
    const pct = Math.round((done / flatLessons.length) * 100);
    document.getElementById("progressPct").textContent = `${isNaN(pct) ? 0 : pct}%`;
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await loadCourseData();
    flatLessons = course.modules.flatMap(m => m.lessons.map(l => ({ ...l, moduleId: m.id })));

    document.getElementById("courseTitle").textContent = course.title;
    renderSyllabus();
    loadLesson(getCurrent() || flatLessons[0]?.id);

    document.getElementById("completeBtn").addEventListener("click", completeCurrent);
    document.getElementById("nextBtn").addEventListener("click", () => go(1));
    document.getElementById("prevBtn").addEventListener("click", () => go(-1));
  });
</script>

<script>
    // Exemplo preparado para integração futura
    async function getUsuarioAutenticado() {
      // Quando integrar, troque por chamada real ao backend
      // Exemplo: const response = await fetch('/api/usuario');
      // const usuario = await response.json();
      // return usuario;
      return {
        autenticado: false, // Troque para true para simular login
        nome: null, // Preencher com nome real
        foto: null // Preencher com caminho real da foto
      };
    }

    async function atualizarHeaderUsuario() {
      const menu = document.querySelector('.menu');
      if (!menu) return;
      const usuario = await getUsuarioAutenticado();
      if (usuario.autenticado) {
        menu.innerHTML = `
          <a href="home.html">Home</a>
          <a href="cursos.html">Cursos</a>
          <a href="#" class="signup" onclick="logout()">Sair</a>
          <span class="user-profile-header">
            <img src="${usuario.foto || '/img/user-placeholder.svg'}" alt="Perfil" class="user-header-photo">
          </span>
        `;
      } else {
        menu.innerHTML = `
          <a href="home.html">Home</a>
          <a href="cursos.html">Cursos</a>
          <a href="index.html">Login</a>
          <a class="signup" href="cadastro.html">Cadastro</a>
        `;
      }
    }
    function logout() {
      alert('Logout simulado!');
      // Integre com backend futuramente
    }
    atualizarHeaderUsuario();
  </script>

</body>
