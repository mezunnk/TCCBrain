<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel do Curso</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="nav">
    <div class="wrap">
      <div class="brand">
        <img src="../../img/logo_branco.png" width="128" height="128" alt="Brain Flow">
      </div>
      <nav class="menu">
        <a href="home.html">Home</a>
        <a href="cursos.html">Cursos</a>
        <a href="index.html">Login</a>
        <a class="signup" href="cadastro.html">Cadastro</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="page">
    <div class="grid">
      <!-- Cabeçalho -->
      <section class="course-hero">
        <h1 class="title">Painel do Curso</h1>
        <p class="sub">Resumo e estatísticas do seu vídeo</p>
      </section>

      <!-- Layout principal -->
      <section class="course-layout">
        <div class="player-area">

          <!-- Vídeo -->
          <div class="video-frame">
            <iframe id="videoFrame" src="" title="Seu vídeo" frameborder="0" allowfullscreen style="width:100%;height:320px;"></iframe>
          </div>

          <!-- Header da aula -->
          <div class="lesson-header">
            <div class="lesson-header-top">
              <h2 class="lesson-title" id="videoTitle">Carregando título...</h2>
              <div class="avaliacao-botoes-wrap">
                <button class="like-btn" aria-label="Likes">
                  <img src="/img/coracao.svg" width="20" height="20">
                </button>
                <span class="stat" id="likesCount">0</span>
                <button class="save-btn" aria-label="Favoritos">
                  <img src="/img/salvar.svg" width="20" height="20">
                </button>
                <span class="stat" id="favoritesCount">0</span>
              </div>
            </div>
            <p class="desc" id="videoDesc">Carregando descrição...</p>
          </div>

          <!-- Estatísticas -->
          <div class="video-stats-row">
            <div class="stat-block"><strong>Visualizações:</strong> <span id="viewsCount">0</span></div>
            <div class="stat-block"><strong>Comentários:</strong> <span id="commentsCount">0</span></div>
            <div class="stat-block"><strong>Média de avaliação:</strong> <span id="ratingAvg">0.0</span></div>
          </div>

          <!-- Comentários -->
          <div class="comments-panel">
            <h3>Comentários</h3>
            <ul class="comments-list" id="commentsList">
              <!-- Comentários dinâmicos -->
            </ul>
          </div>
        </div>

        <!-- Sidebar -->
        <aside class="syllabus" id="syllabus">
          <!-- Conteúdo lateral opcional -->
        </aside>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="wrap footer-inner">
      <span>© Brain Flow</span>
      <nav class="footer-nav">
        <a href="sobre.html">Sobre</a>
        <a href="suporte.html">Suporte</a>
        <a href="termos.html">Termos</a>
      </nav>
    </div>
  </footer>

  <!-- Script dinâmico -->
  <script>
    // Simulação de dados (substitui pela API depois)
    const videoData = {
      title: "Introdução ao Curso BrainFlow",
      desc: "Bem-vindo à primeira aula! Aqui veremos o básico sobre o funcionamento do BrainFlow.",
      videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
      likes: 123,
      favorites: 45,
      views: 456,
      comments: [
        "Usuário 1: Muito bom!",
        "Usuário 2: Parabéns pelo conteúdo.",
        "Usuário 3: Aula muito clara e objetiva!"
      ],
      rating: 4.8
    };

    // Função pra renderizar os dados na página
    function renderVideoData() {
      document.getElementById("videoTitle").textContent = videoData.title;
      document.getElementById("videoDesc").textContent = videoData.desc;
      document.getElementById("likesCount").textContent = videoData.likes;
      document.getElementById("favoritesCount").textContent = videoData.favorites;
      document.getElementById("viewsCount").textContent = videoData.views;
      document.getElementById("commentsCount").textContent = videoData.comments.length;
      document.getElementById("ratingAvg").textContent = videoData.rating.toFixed(1);
      document.getElementById("videoFrame").src = videoData.videoUrl;

      const commentsList = document.getElementById("commentsList");
      commentsList.innerHTML = videoData.comments
        .map(c => `<li class="comment-item">${c}</li>`)
        .join("");
    }

    document.addEventListener("DOMContentLoaded", renderVideoData);
  </script>
</body>
</html>
