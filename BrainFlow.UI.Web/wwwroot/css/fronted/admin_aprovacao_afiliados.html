<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cadastro de Afiliado — BrainFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="nav">
  <div class="wrap">
    <div class="brand">
        <img src="../../img/logo_branco.svg" width="128" height="128" alt="Brain Flow">
    </div>
    <nav class="menu">
      <a href="home.html">Home</a>
      <a href="cursos.html">Cursos</a>
      <a href="index.html">Login</a>
      <a class="signup" href="cadastro.html">Cadastro</a>
    </nav>
  </div>
</header>
  <main class="page">
    <div class="grid">
      <h1 class="section-title">Aprovação de Afiliados</h1>
      
      <!-- Busca -->
      <div class="form-row">
        <input type="search" placeholder="Buscar por nome, e-mail ou CNPJ..." class="search" />
      </div>

      <!-- Tabela de afiliados -->
      <div class="card">
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr style="border-bottom: 2px solid var(--line);">
                <th style="padding: 12px; text-align: left; font-weight: 800; color: var(--ink);">Nome</th>
                <th style="padding: 12px; text-align: left; font-weight: 800; color: var(--ink);">E-mail</th>
                <th style="padding: 12px; text-align: left; font-weight: 800; color: var(--ink);">CNPJ</th>
                <th style="padding: 12px; text-align: left; font-weight: 800; color: var(--ink);">Razão Social</th>
                <th style="padding: 12px; text-align: left; font-weight: 800; color: var(--ink);">Data</th>
                <th style="padding: 12px; text-align: left; font-weight: 800; color: var(--ink);">Status</th>
                <th style="padding: 12px; text-align: left; font-weight: 800; color: var(--ink);">Ações</th>
              </tr>
            </thead>
            <tbody>

            </tbody>
          </table>
        </div>
      </div>

      <!-- Estatísticas -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 32px;">
        <div class="card" style="text-align: center;">
          <h3 style="margin: 0 0 8px; color: var(--accent); font-size: 32px; font-weight: 800;">0</h3>
          <p style="margin: 0; color: var(--muted);">Pendentes</p>
        </div>
        <div class="card" style="text-align: center;">
          <h3 style="margin: 0 0 8px; color: #34c759; font-size: 32px; font-weight: 800;">0</h3>
          <p style="margin: 0; color: var(--muted);">Aprovados</p>
        </div>
        <div class="card" style="text-align: center;">
          <h3 style="margin: 0 0 8px; color: #ff3b30; font-size: 32px; font-weight: 800;">0</h3>
          <p style="margin: 0; color: var(--muted);">Reprovados</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="wrap footer-inner">
      <span>© Brain Flow</span>
      <nav class="footer-nav">
        <a href="sobre.html">Sobre</a>
        <a href="suporte.html">Suporte</a>
        <a href="termos.html">Termos</a>
      </nav>
    </div>
  </footer>

  <script src="header-scroll.js"></script>
</body>

</html>
