<body>
  <!-- Header -->

  <main class="page">
    <div class="grid">
      <h1>Redefinir senha</h1>
      <p class="sub">Digite sua nova senha abaixo.</p>

      <form class="card" action="#" method="post">
        <div class="form-row">
          <label for="new-password">Nova senha</label>
          <input id="new-password" name="new-password" type="password" placeholder="Nova senha" required />
        </div>

        <div class="form-row">
          <label for="confirm-password">Confirmar nova senha</label>
          <input id="confirm-password" name="confirm-password" type="password" placeholder="Confirmar nova senha" required />
        </div>

        <div class="actions">
          <button class="btn primary" type="submit">Redefinir senha</button>
        </div>
      </form>
    </div>
