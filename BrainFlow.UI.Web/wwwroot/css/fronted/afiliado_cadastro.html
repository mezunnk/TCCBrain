<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalhe do Curso</title>
  <link rel="stylesheet" href="style.css" />

</head>
<body>

<header class="nav">
  <div class="wrap">
    <div class="brand">
  <img src="../../img/logo_branco.svg" width="128" height="128" alt="Brain Flow">
    </div>
    <nav class="menu">
      <a href="home.html">Home</a>
      <a href="cursos.html">Cursos</a>
      <a href="index.html">Login</a>
      <a class="signup" href="cadastro.html">Cadastro</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="grid">
    <h1 class="animate-fade-in">Cadastro de Afiliado</h1>
    <p class="sub animate-slide-left">Preencha seus dados pessoais e de pessoa jurídica para análise.</p>
    <form class="card animate-slide-right" action="#" method="post">
      <div class="form-row">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" placeholder="Seu nome" required />
      </div>
      <div class="form-row">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="Seu email" required />
      </div>
      <div class="form-row">
        <label for="cnpj">CNPJ/MEI</label>
        <input id="cnpj" name="cnpj" type="text" placeholder="Seu CNPJ/MEI" required />
      </div>
      <div class="form-row">
        <label for="razao">Razão Social</label>
        <input id="razao" name="razao" type="text" placeholder="Sua Razão Social" required />
      </div>
      <div class="form-row">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="text" placeholder="Seu número de telefone" required />
      </div>
      <div class="form-row">
        <label for="site">Site/Portfólio (opcional)</label>
        <input id="site" name="site" type="text" placeholder="Url do seu site ou portfólio" />
      </div>
      <div class="form-row">
        <label for="sobre">Sobre você</label>
        <textarea id="sobre" name="sobre" rows="4" placeholder="Descreva sua experiência profissional e cursos que pretende oferecer"></textarea>
      </div>
      <div class="actions">
        <button class="btn primary" type="submit">Enviar para análise</button>
        <a href="/" class="btn">Cancelar</a>
      </div>
    </form>
  </div>
</main>

<footer class="py-4 bg-dark text-center text-white-50"><small>© BrainFlow</small></footer>
</body>

</html>
